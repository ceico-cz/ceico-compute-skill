name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check scripts
        run: bash -n ceico-compute/scripts/*.sh
      - name: Build zip
        run: zip -r ceico-compute.zip ceico-compute
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ceico-compute.zip --title "$GITHUB_REF_NAME" --generate-notes
